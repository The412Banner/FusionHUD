plugins {
    id 'com.android.library'
}
apply plugin: 'kotlin-android'

android {
    // NOTE: the namespace is deliberately `com.winlator.star` (NOT `com.winlator.star.hud`).
    // The copied classic overlays (FrameRating / FrameRatingHorizontal) do `import com.winlator.star.R`,
    // and AGP generates the R class at the module namespace. Keeping the namespace here makes that
    // import resolve UNCHANGED, which is the whole point of shipping the HUD byte-identical.
    namespace 'com.winlator.star'
    compileSdk 34

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
