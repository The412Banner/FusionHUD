FusionHUD Decky plugin presets: Steam's performance overlay levels 1-4 = Minimal, Pill, Full, Mega.
Written by the FusionHUD plugin; turning the plugin's switch off removes this file (and puts back a presets.conf you had before).
Colours follow FusionHUD (https://github.com/The412Banner/FusionHUD). Lines before the first [preset N] are ignored by MangoHud.

